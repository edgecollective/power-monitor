; ProMicro NRF52840 external watchdog / power cycler
;
; Build:   pio run                       -> .pio/build/promicro_cycler/firmware.uf2
; Flash:   pio run -t upload             (serial DFU via Adafruit bootloader)
;    or:   double-tap RST, drag firmware.uf2 onto the mounted drive
; Monitor: pio device monitor

[platformio]
default_envs = promicro_cycler

[env:promicro_cycler]
platform = nordicnrf52
platform_packages =
  framework-arduinoadafruitnrf52 @ 1.10700.0
framework = arduino
board = promicro_nrf52840
monitor_speed = 115200
extra_scripts = post:create-uf2.py
build_flags =
  -D NRF52_PLATFORM
  ; Output pin, as a raw nRF GPIO number (P0.17 = 17, P1.xx = 32 + xx)
  -D CYCLE_PIN=17
  -D SLEEP_MS=10000
  -D ON_MS=10000
  ; 1 = also light the blue LED while the pin is high (adds ~1-3 mA, keep 0 when measuring)
  -D MIRROR_LED=1
